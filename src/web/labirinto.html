<!doctype html>
<!--
  labirinto.html  -  modelo da pagina interativa (React).
  [IA] Claude Code – interface React do labirinto interativo (so visualizacao/UX).

  Este arquivo NAO roda sozinho: o src/viz.py troca __VENDOR__ pelas bibliotecas
  (React, ReactDOM e htm, embutidas para funcionar sem internet) e __DADOS__
  pelos dados que o Python calculou (grade, metricas, percursos de cada algoritmo).
  Nenhum algoritmo roda aqui: a pagina so desenha o que o Python mandou.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labirinto Interativo · Grafo de Estados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0b1020; --bg2:#0f1629; --card:#141c31; --card2:#1a2440; --linha:#26314f; --linha2:#33416a;
    --txt:#eef2ff; --txt2:#a5b0cc; --txt3:#6b7799;
    --acento:#7c9cff; --acento2:#5b7cf5; --sobre-acento:#0b1020;
    --ok:#34d399; --erro:#f87171; --alerta:#fbbf24;
    --parede:#1d2640; --parede2:#232e4d; --chao:#e8ecf6; --chao2:#dfe5f1;
    --lama:#b98549; --agua:#5b9bd5; --chave:#f6d860; --porta:#a78bfa;
    --inicio:#4ade80; --saida:#fb923c; --esteira:#94a3b8; --bonus:#f472b6; --fonte:#2dd4bf;
    --jogador:#ffffff;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r:14px; --sombra:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f3f5fb; --bg2:#e9edf7; --card:#ffffff; --card2:#f5f7fc; --linha:#dde3f0; --linha2:#c8d1e4;
    --txt:#0f172a; --txt2:#475569; --txt3:#7a879f;
    --acento:#4f6bed; --acento2:#3b55d4; --sobre-acento:#ffffff;
    --ok:#059669; --erro:#dc2626; --alerta:#b45309;
    --parede:#2a3350; --parede2:#323c5c; --chao:#ffffff; --chao2:#f1f4fa;
    --sombra:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  html{font-size:19px}  /* base maior: todos os tamanhos em rem crescem junto */
  body{font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
       background:radial-gradient(1200px 500px at 10% -10%,rgba(124,156,255,.10),transparent 60%),var(--bg)}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  .mono{font-family:var(--mono)}
  :focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:6px}

  /* a pagina inteira cabe na janela: so os paineis internos rolam, se precisar */
  .casca{height:100vh;padding:.6rem .8rem;display:flex;flex-direction:column;gap:.6rem}

  /* ---------- topo: marca + todos os seletores numa barra so ---------- */
  .topo{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.1rem;background:var(--card);border:1px solid var(--linha);
        border-radius:var(--r);padding:.5rem .8rem;box-shadow:var(--sombra);flex:none}
  .marca{display:flex;align-items:center;gap:.55rem}
  .logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
        background:linear-gradient(135deg,var(--acento),#c084fc);color:#0b1020;font-weight:800;font-family:var(--mono)}
  .marca h1{font-size:.95rem;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .icone{background:var(--card2);border:1px solid var(--linha);border-radius:9px;height:38px;padding:0 .7rem;margin-left:auto;
         color:var(--txt2);font-size:.8rem;display:inline-flex;align-items:center;gap:.4rem;transition:.15s;white-space:nowrap}
  .icone:hover{border-color:var(--acento);color:var(--txt)}
  .grupo{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
  .rot-sel{font-size:.75rem;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;flex:none}
  .fichas{display:flex;gap:.35rem;flex-wrap:wrap}
  .ficha{border:1px solid var(--linha);background:var(--bg2);border-radius:999px;padding:.3rem .75rem;font-size:.8rem;
         color:var(--txt2);transition:.15s;display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
  .ficha:hover{border-color:var(--linha2);color:var(--txt)}
  .ficha[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento);font-weight:600}
  .ficha small{opacity:.7;font-family:var(--mono);font-size:.72rem}
  .bolinha{width:8px;height:8px;border-radius:50%;flex:none}
  /* objetivo didatico do mapa: uma linha discreta logo abaixo da barra */
  .objetivo-mapa{flex:none;margin:-.25rem 0 0;padding:0 .85rem;font-size:.76rem;line-height:1.35;color:var(--txt2);
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .objetivo-mapa b{color:var(--txt);font-weight:600}
  .ficha[aria-pressed="true"] .bolinha{box-shadow:0 0 0 2px rgba(255,255,255,.6)}

  /* ---------- grelha principal ---------- */
  .grelha{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:.6rem}
  .cartao{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;
          display:flex;flex-direction:column;min-height:0}

  .palco{flex:1;min-height:0;padding:.4rem;display:flex;overflow:auto;background:var(--bg2)}
  .pistas{margin:auto;display:grid;gap:1.2rem;justify-content:center;align-items:start}
  .pista{display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
  .pista-topo{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.85rem}
  .pista-nome{font-weight:700}
  .etiqueta{font-family:var(--mono);font-size:.72rem;padding:.12rem .5rem;border-radius:6px;background:var(--card2);
            border:1px solid var(--linha);color:var(--txt2)}
  .etiqueta.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .etiqueta.erro{color:var(--erro);border-color:color-mix(in srgb,var(--erro) 40%,transparent)}
  .etiqueta.alerta{color:var(--alerta);border-color:color-mix(in srgb,var(--alerta) 40%,transparent)}

  .tabuleiro{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--linha2),0 12px 30px -16px rgba(0,0,0,.7)}
  .grade{display:grid}
  .cel{width:var(--cel);height:var(--cel);display:flex;align-items:center;justify-content:center;position:relative;
       font-family:var(--mono);font-weight:700;font-size:calc(var(--cel)*.44);color:#1e293b;background:var(--chao);
       box-shadow:inset 0 0 0 .5px rgba(15,23,42,.08);transition:opacity .2s, filter .2s}
  .cel.p{background:var(--parede);box-shadow:inset 0 0 0 .5px var(--parede2)}
  .cel.o:nth-child(odd){background:var(--chao2)}
  .cel.st{background:var(--inicio)} .cel.go{background:var(--saida)}
  .cel.mu{background:radial-gradient(circle at 30% 35%,rgba(0,0,0,.18) 12%,transparent 13%) 0 0/50% 50%,var(--lama)}
  .cel.ag{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 2px,transparent 2px 6px),var(--agua)}
  .cel.ch{background:var(--chave)}
  .cel.po{background:var(--porta);color:#2e1065}
  .cel.po.aberta{background:repeating-linear-gradient(90deg,var(--porta) 0 3px,var(--chao) 3px 7px);color:#5b21b6}
  .cel.es{background:var(--esteira);color:#0f172a}
  .cel.bo{background:var(--bonus);color:#500724}
  .cel.bo.gasto{background:var(--chao);color:#f9a8d4}
  .cel.fo{background:var(--fonte);color:#042f2e}
  .cel.apagada{opacity:.14;filter:grayscale(1)}
  .cel.presa::after{content:"";position:absolute;inset:0;
       background:repeating-linear-gradient(45deg,rgba(239,68,68,.55) 0 2px,transparent 2px 5px);
       box-shadow:inset 0 0 0 2px rgba(239,68,68,.9)}
  .sobre{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .jogador{transition:transform var(--dur,180ms) cubic-bezier(.3,.7,.3,1)}
  .pulso{animation:pulso 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulso{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}

  /* ---------- transporte ---------- */
  .transporte{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.55rem .8rem;border-top:1px solid var(--linha);
              background:var(--card);flex:none}
  .botoes{display:flex;gap:.3rem}
  .bt{background:var(--card2);border:1px solid var(--linha);color:var(--txt2);min-width:42px;height:42px;border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;transition:.15s}
  .bt:hover:not(:disabled){border-color:var(--acento);color:var(--txt)}
  .bt:disabled{opacity:.35;cursor:not-allowed}
  .bt.tocar{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento);font-weight:700;padding:0 1rem;gap:.45rem;min-width:7.6rem}
  .bt.tocar:hover:not(:disabled){background:var(--acento2);border-color:var(--acento2);color:var(--sobre-acento)}
  .bt svg{width:18px;height:18px}
  .linha-tempo{display:flex;align-items:center;gap:.7rem;flex:1;min-width:12rem}
  .linha-tempo input{flex:1}
  .contador{font-family:var(--mono);font-size:.78rem;color:var(--txt2);white-space:nowrap;min-width:6rem;text-align:right}
  input[type=range]{accent-color:var(--acento);height:4px;cursor:pointer}
  .campo{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--txt3)}
  .campo input[type=range]{width:5rem}
  .campo b{font-family:var(--mono);font-weight:500;color:var(--txt2);min-width:2.6rem}
  .alternar{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--txt2);cursor:pointer;user-select:none;
            border:1px solid var(--linha);border-radius:999px;padding:.3rem .7rem;background:var(--bg2);transition:.15s}
  .alternar:has(input:checked){border-color:var(--acento);color:var(--txt)}
  .alternar input{accent-color:var(--acento);margin:0;width:15px;height:15px}
  .seletor{background:var(--card2);border:1px solid var(--linha);border-radius:8px;padding:.25rem .45rem;font-size:.8rem}
  .dica{font-size:.72rem;color:var(--txt3)}
  .dica kbd{font-family:var(--mono);font-size:.68rem;border:1px solid var(--linha2);border-bottom-width:2px;border-radius:5px;padding:0 .3rem;color:var(--txt2)}

  /* ---------- painel lateral: estado fixo em cima, o resto em abas ---------- */
  aside{display:flex;flex-direction:column;gap:.6rem;min-height:0}
  .bloco{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:.75rem .85rem;box-shadow:var(--sombra)}
  .bloco h2{font-size:.76rem;font-weight:700;color:var(--txt3);margin:0 0 .5rem;letter-spacing:.08em;text-transform:uppercase;
            display:flex;align-items:center;justify-content:space-between}
  .rotulo{font-family:var(--mono);font-size:.95rem;font-weight:700;word-break:break-all;line-height:1.3;margin-bottom:.55rem;
          padding:.4rem .6rem;border-radius:9px;background:var(--bg2);border:1px solid var(--linha)}
  .infos{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .8rem}
  .info{display:flex;flex-direction:column;gap:.1rem;min-width:0}
  .info>span:first-child{font-size:.78rem;color:var(--txt3)}
  .info>span:last-child{font-family:var(--mono);font-size:.9rem;font-weight:500;font-variant-numeric:tabular-nums}
  .custo-grande{display:flex;align-items:baseline;gap:.6rem;margin-top:.55rem;padding-top:.5rem;border-top:1px dashed var(--linha)}
  .custo-grande strong{font-family:var(--mono);font-size:1.5rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .custo-grande span{font-size:.78rem;color:var(--txt3)}
  .delta{font-family:var(--mono);font-size:.8rem;padding:.08rem .45rem;border-radius:6px;background:var(--bg2)}
  .delta.neg{color:var(--ok)} .delta.pos{color:var(--txt2)}
  .chaves{display:flex;gap:.25rem;flex-wrap:wrap}
  .chave{width:1.35rem;height:1.35rem;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem;
         border:1.5px dashed var(--linha2);color:var(--txt3)}
  .chave.tem{border-style:solid;border-color:transparent;color:#1e293b}
  .vazio{color:var(--txt3);font-family:var(--mono)}

  .painel-abas{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;overflow:hidden}
  .abas{display:flex;border-bottom:1px solid var(--linha);flex:none}
  .abas button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:.55rem .2rem .45rem;font-size:.82rem;
               font-weight:600;color:var(--txt3);transition:.15s;white-space:nowrap}
  .abas button:hover{color:var(--txt)}
  .abas button[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento)}
  .conteudo-aba{flex:1;min-height:0;overflow:auto;padding:.7rem .85rem}
  .eventos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
  .eventos button{width:100%;display:flex;align-items:center;gap:.6rem;background:none;border:1px solid transparent;border-radius:8px;
                  padding:.3rem .45rem;text-align:left;font-size:.8rem;color:var(--txt2)}
  .eventos button:hover{background:var(--bg2);border-color:var(--linha)}
  .eventos button.passado{color:var(--txt)}
  .eventos button.atual{background:var(--bg2);border-color:var(--acento)}
  .eventos .n{font-family:var(--mono);font-size:.72rem;color:var(--txt3);min-width:2.4rem}
  .eventos .ic{width:.7rem;height:.7rem;border-radius:3px;flex:none}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .tile{background:var(--bg2);border:1px solid var(--linha);border-radius:10px;padding:.55rem .7rem}
  .tile span{display:block;font-size:.7rem;color:var(--txt3)}
  .tile b{font-family:var(--mono);font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
  .ocupacao{grid-column:1/-1}
  .medidor{height:6px;border-radius:99px;background:var(--linha);margin-top:.4rem;overflow:hidden}
  .medidor i{display:block;height:100%;background:linear-gradient(90deg,var(--acento),#c084fc);border-radius:99px}

  table.comp{width:100%;border-collapse:collapse;font-size:.8rem}
  table.comp th{font-size:.68rem;color:var(--txt3);font-weight:600;text-align:left;padding:.3rem .35rem;border-bottom:1px solid var(--linha)}
  table.comp td{padding:.4rem .35rem;border-bottom:1px solid var(--linha);font-family:var(--mono)}
  table.comp td:first-child{font-family:var(--sans);font-weight:600}
  table.comp tr{cursor:pointer;transition:background .15s}
  table.comp tbody tr:hover{background:var(--bg2)}
  table.comp tr.sel td{color:var(--acento)}
  table.comp .num{text-align:right}

  .aviso{border-radius:12px;padding:.8rem .9rem;font-size:.83rem;line-height:1.5;border:1px solid}
  .aviso.erro{background:color-mix(in srgb,var(--erro) 10%,transparent);border-color:color-mix(in srgb,var(--erro) 40%,transparent)}
  .aviso.alerta{background:color-mix(in srgb,var(--alerta) 10%,transparent);border-color:color-mix(in srgb,var(--alerta) 40%,transparent)}
  .aviso b{display:block;margin-bottom:.2rem}
  .aviso{padding:.6rem .75rem;font-size:.78rem;flex:none}
  .aviso code{display:block;margin-top:.35rem;font-family:var(--mono);font-size:.7rem;word-break:break-all;color:var(--txt2);
              max-height:3.2rem;overflow:auto}

  .legenda{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .8rem;font-size:.78rem;color:var(--txt2)}
  .legenda span{display:inline-flex;align-items:center;gap:.45rem}
  .sw{width:.9rem;height:.9rem;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .legenda .titulo{grid-column:1/-1;font-size:.7rem;color:var(--txt3);margin-top:.3rem}

  /* ---------- upload de mapa (modo servidor) ---------- */
  .icone.carregar{margin-left:0;cursor:pointer;color:var(--txt);border-color:var(--acento)}
  .faixa-carga{flex:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.45rem .8rem;
               border-radius:10px;border:1px solid;font-size:.85rem}
  .faixa-carga.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
  .faixa-carga.erro{color:var(--erro);border-color:color-mix(in srgb,var(--erro) 40%,transparent);background:color-mix(in srgb,var(--erro) 8%,transparent)}
  .faixa-carga.carregando{color:var(--txt2);border-color:var(--linha)}
  .faixa-carga button{background:none;border:0;font-size:1.1rem;line-height:1;color:inherit}

  /* ---------- home ---------- */
  .icone.voltar{margin-left:0}
  .home{min-height:100vh;display:flex;flex-direction:column;padding:1rem}
  .home-topo{display:flex;justify-content:flex-end}
  .home-centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:1rem 0 3rem}
  .home-titulo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem}
  .home-titulo h1{margin:.4rem 0 0;font-size:2rem;letter-spacing:-.02em}
  .home-titulo p{margin:0;color:var(--txt2);font-size:1rem;max-width:40rem}
  .logo.grande{width:64px;height:64px;border-radius:18px;font-size:2rem}
  .home-cartoes{display:grid;grid-template-columns:repeat(2,minmax(0,22rem));gap:1.2rem}
  @media (max-width:820px){.home-cartoes{grid-template-columns:minmax(0,1fr)}}
  .home-cartao{text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:1.4rem 1.5rem;
               box-shadow:var(--sombra);display:flex;flex-direction:column;gap:.6rem;transition:.18s}
  .home-cartao:hover{border-color:var(--acento);transform:translateY(-3px)}
  .home-num{font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--acento);text-transform:uppercase;letter-spacing:.08em}
  .home-cartao h2{margin:0;font-size:1.35rem}
  .home-cartao p{margin:0;color:var(--txt2);font-size:.92rem}
  .home-cartao ul{margin:.2rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.25rem;font-size:.88rem;color:var(--txt2)}
  .home-cartao li b{color:var(--txt);font-family:var(--mono)}
  .home-ir{margin-top:auto;padding-top:.4rem;font-weight:600;color:var(--acento)}
  .parte2{flex:1;display:flex;align-items:center;justify-content:center}
  .parte2-corpo{max-width:44rem;padding:2rem;display:flex;flex-direction:column;gap:.7rem;align-items:flex-start}
  .parte2-corpo h2{margin:0;font-size:1.5rem}
  .parte2-corpo p{margin:0;color:var(--txt2);overflow-wrap:anywhere}
  .erro-carga{max-width:40rem;margin:4rem auto;padding:1.2rem;border-radius:12px;border:1px solid var(--erro);color:var(--txt)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  /* tela estreita (celular/janela pequena): empilha e volta a rolar a pagina */
  @media (max-width:1060px){
    .casca{height:auto;min-height:100vh}
    .grelha{grid-template-columns:1fr}
    .palco{flex:none;height:65vh}
    .painel-abas{flex:none;height:22rem}
  }
  @media (max-width:560px){.casca{padding:.5rem}.dica{display:none}.objetivo-mapa{white-space:normal}}
    .galeria-p1{
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding:1rem;
      background:var(--card);
      border:1px solid var(--linha);
      border-radius:var(--r);
  }

  .galeria-p1-titulo{
      margin-bottom:1.4rem;
  }

  .galeria-p1-titulo h2{
      margin:0;
      font-size:1.4rem;
  }

  .galeria-p1-titulo p{
      color:var(--txt2);
      margin:.4rem 0 0;
      font-size:.85rem;
  }

  .galeria-p1-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:1rem;
  }

  .figura-p1{
      margin:0;
      padding:1rem;
      background:var(--card2);
      border:1px solid var(--linha);
      border-radius:var(--r);
      min-width:0;
  }

  .figura-p1 h3{

<script>
"use strict";
const DADOS = __DADOS__;
const FIGURAS_PARTE1 = __FIGURAS_PARTE1__;

(function(){
if (!window.React || !window.ReactDOM || !window.htm){
  document.getElementById("carregando").textContent = "Não foi possível carregar o React. Gere a página de novo com o viz.py.";
  return;
}
const {useState, useEffect, useMemo, useRef, memo} = React;
const html = htm.bind(React.createElement);

// ------------------------------------------------------------------ constantes
const ORDEM_ALG = ["BFS", "DFS", "DIJKSTRA", "BELLMAN_FORD"];
const INFO_ALG = {
  BFS:          {nome:"BFS",          ideia:"menor número de passos"},
  DFS:          {nome:"DFS",          ideia:"busca em profundidade"},
  DIJKSTRA:     {nome:"Dijkstra",     ideia:"menor custo (só pesos ≥ 0)"},
  BELLMAN_FORD: {nome:"Bellman-Ford", ideia:"menor custo, aceita pesos negativos"},
};
// cor do percurso por numero de chaves que o jogador ja tem (camada)
const COR_CAMADA = ["#3b82f6", "#a855f7", "#ec4899", "#f59e0b", "#14b8a6"];
const corCamada = chaves => COR_CAMADA[Math.min((chaves || "").replace("-", "").length, COR_CAMADA.length - 1)];
const COR_STATUS = {OK:"var(--ok)", CICLO_NEGATIVO:"var(--erro)", SEM_SOLUCAO:"var(--txt3)", RECUSA:"var(--alerta)"};
const TXT_STATUS = {OK:"ok", CICLO_NEGATIVO:"ciclo negativo", SEM_SOLUCAO:"sem solução", RECUSA:"recusou"};
const SETA = {"^":"↑", ">":"→", "v":"↓", "<":"←"};
// [IA] Claude Code – front/UX: objetivo didatico de cada mapa (so texto; mapas enviados nao tem)
const OBJETIVO_MAPA = {
  m01_terreno:     "Demonstrar a diferença entre o caminho com menos passos e o caminho de menor custo.",
  m02_uma_chave:   "Demonstrar a necessidade do grafo de estados para representar a coleta de uma chave.",
  m03_tres_chaves: "Demonstrar o crescimento do grafo de estados com múltiplas chaves e portas.",
  m04_esteiras:    "Demonstrar como as esteiras podem gerar becos e estados-armadilha.",
  m05_bonus:       "Demonstrar a existência de pesos negativos sem ciclos negativos no grafo de estados.",
  m06_fonte:       "Demonstrar a existência de um ciclo negativo real causado pela fonte de energia.",
  m07_impossivel:  "Demonstrar um labirinto sem solução devido à impossibilidade de obter a chave.",
  m08_grande:      "Demonstrar a escalabilidade do grafo de estados em um labirinto de grandes dimensões.",
  g01_tres_chaves: "Demonstrar a combinação de chaves, portas, bônus, esteiras e terrenos em um único mapa.",
  g02_porao:       "Demonstrar a existência de uma região com muitos estados-armadilha em um labirinto que possui solução.",
};
const CLASSE = {"#":"p",".":"o","S":"st","G":"go",",":"mu","~":"ag","+":"bo","*":"fo",">":"es","<":"es","^":"es","v":"es"};
const classeDe = ch => CLASSE[ch] || ("abcd".includes(ch) ? "ch" : "ABCD".includes(ch) ? "po" : "o");
// custo de ENTRAR na casa (tabela do enunciado); usado so para exibir o custo do percurso da BFS
const CUSTO = {".":1,"S":1,"G":1,",":3,"~":5,"*":-2};
const custoCasa = ch => CUSTO[ch] !== undefined ? CUSTO[ch] : 1;
function nomeCasa(ch){
  if ("abcd".includes(ch)) return "chave " + ch;
  if ("ABCD".includes(ch)) return "porta " + ch;
  if (SETA[ch]) return "esteira " + SETA[ch];
  return {".":"chão", ",":"lama", "~":"água", "+":"bônus", "*":"fonte", "S":"início", "G":"saída", "#":"parede"}[ch] || ch;
}
const semMovimento = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// "(3,5)|ab|{0,2}" -> estado
function lerRotulo(r){
  const m = /^\((\d+),(\d+)\)\|([^|]*)\|\{([^}]*)\}$/.exec(r);
  if (!m) return null;
  return {l:+m[1], c:+m[2], chaves:m[3] === "-" ? "" : m[3],
          bonus:m[4] ? m[4].split(",").map(Number) : [], custo:null, rotulo:r};
}

// passos a animar de um percurso (o ciclo negativo tambem vira uma animacao)
function passosDe(p){
  if (!p) return [];
  if (p.status === "OK") return p.passos;
  if (p.status === "CICLO_NEGATIVO") return (p.ciclo || []).map(lerRotulo).filter(Boolean);
  return [];
}

// custo do percurso casa a casa; na BFS o Python manda distancia em passos, entao recalcula pelo terreno
function custosDe(mapa, alg, passos){
  if (!passos.length) return [];
  if (alg !== "BFS" && passos.every(s => s.custo !== null && s.custo !== undefined)) return passos.map(s => s.custo);
  const out = [0];
  for (let j = 1; j < passos.length; j++){
    const s = passos[j], ch = mapa.grade[s.l][s.c];
    let v = custoCasa(ch);
    if (ch === "+") v = s.bonus.length > passos[j-1].bonus.length ? -4 : 1;
    if (ch === "*" && mapa.fonte === "consumivel")
      v = s.bonus.length > passos[j-1].bonus.length ? -2 : 1;
    out.push(out[j-1] + v);
  }
  return out;
}

// momentos importantes do percurso (para a lista clicavel)
function eventosDe(mapa, passos){
  const ev = [];
  for (let j = 1; j < passos.length; j++){
    const s = passos[j], a = passos[j-1], ch = mapa.grade[s.l][s.c];
    if ((s.chaves || "") !== (a.chaves || "")) ev.push({j, txt:"pegou a chave " + ch, cor:"var(--chave)"});
    else if ("ABCD".includes(ch) && !"ABCD".includes(mapa.grade[a.l][a.c])) ev.push({j, txt:"passou pela porta " + ch, cor:"var(--porta)"});
    else if (ch === "+" && s.bonus.length > a.bonus.length) ev.push({j, txt:"consumiu um bônus (−4)", cor:"var(--bonus)"});
    else if (ch === "*") {
      const consumida = mapa.fonte === "consumivel"
        && s.bonus.length === a.bonus.length;

      ev.push({
        j,
        txt: consumida ? "passou na fonte já consumida (+1)" : "passou na fonte (−2)",
        cor: "var(--fonte)"
      });
    }
    else if (SETA[ch] && !SETA[mapa.grade[a.l][a.c]]) ev.push({j, txt:"subiu na esteira " + SETA[ch], cor:"var(--esteira)"});
    else if (ch === "G") ev.push({j, txt:"chegou à saída", cor:"var(--saida)"});
  }
  return ev;
}

// indice de cada bonus "+" (ordem de leitura: linha, depois coluna)
function indicesBonus(grade, fonte="infinita"){
  const m = {};
  let k = 0;

  grade.forEach((linha, l) => linha.forEach((ch, c) => {
    if (ch === "+") m[l + "," + c] = k++;
  }));

  if (fonte === "consumivel"){
    grade.forEach((linha, l) => linha.forEach((ch, c) => {
      if (ch === "*") m[l + "," + c] = k++;
    }));
  }

  return m;
}

const fmt = v => v === null || v === undefined ? "—" : (Number.isInteger(v) ? String(v) : v.toFixed(2));

// ------------------------------------------------------------------ icones
const Ic = {
  inicio: html`<svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="2" height="10" rx="1"/><path d="M13 3.5v9a.5.5 0 0 1-.8.4L5.5 8.4a.5.5 0 0 1 0-.8l6.7-4.5a.5.5 0 0 1 .8.4z"/></svg>`,
  voltar: html`<svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 3.5v9a.5.5 0 0 1-.8.4L3.5 8.4a.5.5 0 0 1 0-.8l6.7-4.5a.5.5 0 0 1 .8.4z"/></svg>`,
  avancar: html`<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9a.5.5 0 0 0 .8.4l6.7-4.5a.5.5 0 0 0 0-.8L5.8 3.1a.5.5 0 0 0-.8.4z"/></svg>`,
  fim: html`<svg viewBox="0 0 16 16" fill="currentColor"><rect x="12" y="3" width="2" height="10" rx="1"/><path d="M3 3.5v9a.5.5 0 0 0 .8.4l6.7-4.5a.5.5 0 0 0 0-.8L3.8 3.1a.5.5 0 0 0-.8.4z"/></svg>`,
  tocar: html`<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.8v10.4a.6.6 0 0 0 .9.5l8.4-5.2a.6.6 0 0 0 0-1L4.9 2.3a.6.6 0 0 0-.9.5z"/></svg>`,
  pausar: html`<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>`,
};

// ------------------------------------------------------------------ grade (so muda quando muda chave/bonus/filtro)
const Grade = memo(function Grade({mapa, dentro, presas, chaves, bonusTxt, idxBonus}){
  const gastos = new Set(bonusTxt ? bonusTxt.split(",").map(Number) : []);
  const cels = [];
  for (let l = 0; l < mapa.linhas; l++){
    for (let c = 0; c < mapa.colunas; c++){
      const ch = mapa.grade[l][c];
      let cls = "cel " + classeDe(ch);
      let txt = ch;
      if (ch === "#" || ch === "." || ch === "," || ch === "~") txt = "";
      if (SETA[ch]) txt = SETA[ch];
      if (ch === "*") txt = "✦";
      if ("ABCD".includes(ch) && chaves.includes(ch.toLowerCase())) cls += " aberta";
      if ((ch === "+" || ch === "*") && gastos.has(idxBonus[l + "," + c])) cls += " gasto";
      if (dentro && ch !== "#" && !dentro.has(l + "," + c)) cls += " apagada";
      if (presas && presas.has(l + "," + c)) cls += " presa";
      cels.push(html`<div key=${l + "," + c} className=${cls} title=${"(" + l + "," + c + ") " + nomeCasa(ch)}>${txt}</div>`);
    }
  }
  return html`<div className="grade" style=${{gridTemplateColumns:"repeat(" + mapa.colunas + ", var(--cel))"}}>${cels}</div>`;
});

// ------------------------------------------------------------------ camada por cima da grade: trilha e jogador
function Sobreposicao({mapa, passos, k, mostrarTrilha, ciclo, dur}){
  if (!passos.length) return null;
  const pt = s => (s.c + .5) + "," + (s.l + .5);
  const todos = passos.map(pt).join(" ");
  // trechos ja percorridos, separados por camada (muda de cor a cada chave)
  const trechos = [];
  if (mostrarTrilha && !ciclo){
    let ini = 0;
    for (let j = 1; j <= k; j++){
      if ((passos[j].chaves || "") !== (passos[j-1].chaves || "")){
        trechos.push({de:ini, ate:j, cor:corCamada(passos[ini].chaves)});
        ini = j;
      }
    }
    if (k > ini) trechos.push({de:ini, ate:k, cor:corCamada(passos[ini].chaves)});
  }
  const marcos = [];
  for (let j = 1; j <= k && !ciclo; j++)
    if ((passos[j].chaves || "") !== (passos[j-1].chaves || "")) marcos.push({s:passos[j], cor:corCamada(passos[j].chaves)});
  const atual = passos[k];
  const corJog = ciclo ? "var(--erro)" : corCamada(atual.chaves);
  return html`
    <svg className="sobre" viewBox=${"0 0 " + mapa.colunas + " " + mapa.linhas} preserveAspectRatio="none" aria-hidden="true">
      ${mostrarTrilha && !ciclo && html`<polyline points=${todos} fill="none" stroke="rgba(100,116,139,.55)" stroke-width=".09"
          stroke-dasharray=".22 .2" stroke-linecap="round" stroke-linejoin="round"/>`}
      ${ciclo && html`<polygon points=${todos} fill="rgba(248,113,113,.12)" stroke="var(--erro)" stroke-width=".14"
          stroke-dasharray=".3 .18" stroke-linejoin="round"/>`}
      ${trechos.map((t, n) => html`
        <g key=${n}>
          <polyline points=${passos.slice(t.de, t.ate + 1).map(pt).join(" ")} fill="none" stroke="rgba(15,23,42,.35)"
            stroke-width=".42" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points=${passos.slice(t.de, t.ate + 1).map(pt).join(" ")} fill="none" stroke=${t.cor}
            stroke-width=".26" stroke-linecap="round" stroke-linejoin="round"/>
        </g>`)}
      ${marcos.map((m, n) => html`<circle key=${"m" + n} cx=${m.s.c + .5} cy=${m.s.l + .5} r=".26" fill=${m.cor} stroke="#fff" stroke-width=".07"/>`)}
      <g className="jogador" style=${{transform:"translate(" + (atual.c + .5) + "px," + (atual.l + .5) + "px)", "--dur":dur + "ms"}}>
        <circle className="pulso" r=".34" fill="none" stroke=${corJog} stroke-width=".08"/>
        <circle r=".34" fill="var(--jogador)" stroke=${corJog} stroke-width=".12"/>
        <circle r=".13" fill=${corJog}/>
      </g>
    </svg>`;
}

// ------------------------------------------------------------------ um tabuleiro (uma "pista" por algoritmo)
function Pista({mapa, alg, k, dentro, presas, mostrarTrilha, idxBonus, dur}){
  const p = mapa.percursos[alg];
  const passos = passosDe(p);
  const kk = passos.length ? Math.min(k, passos.length - 1) : 0;
  const atual = passos[kk];
  const ciclo = p && p.status === "CICLO_NEGATIVO";
  const custos = useMemo(() => custosDe(mapa, alg, passos), [mapa, alg, p]);
  return html`
    <div className="pista">
      <div className="pista-topo">
        <span className="bolinha" style=${{background:COR_STATUS[p ? p.status : "SEM_SOLUCAO"]}}></span>
        <span className="pista-nome">${INFO_ALG[alg] ? INFO_ALG[alg].nome : alg}</span>
        ${p && p.status === "OK" ? html`
          <span className="etiqueta">${p.n_passos} passos</span>
          <span className="etiqueta ok">custo ${fmt(custos[custos.length - 1])}</span>`
        : html`<span className=${"etiqueta " + (ciclo ? "erro" : p && p.status === "RECUSA" ? "alerta" : "")}>${TXT_STATUS[p ? p.status : "SEM_SOLUCAO"] || (p && p.status)}</span>`}
      </div>
      <div className="tabuleiro">
        <${Grade} mapa=${mapa} dentro=${dentro} presas=${presas} idxBonus=${idxBonus}
          chaves=${atual ? (atual.chaves || "") : ""} bonusTxt=${atual ? atual.bonus.join(",") : ""}/>
        <${Sobreposicao} mapa=${mapa} passos=${passos} k=${kk} mostrarTrilha=${mostrarTrilha} ciclo=${ciclo} dur=${dur}/>
      </div>
    </div>`;
}

function GaleriaParte1(){

function Parte1({tema, setTema, aoVoltar, servidor}){
  const nomes = Object.keys(DADOS).sort((a, b) => {
    const grupoA = a.startsWith("g");
    const grupoB = b.startsWith("g");

    if (grupoA !== grupoB) return grupoA ? 1 : -1;

    return a.localeCompare(b);
  });
  const [nomeMapa, setNomeMapa] = useState(nomes.includes("m01_terreno") ? "m01_terreno" : nomes[0]);
  // upload de mapa novo: so existe rodando "python -m src.servidor" (o Python calcula, a pagina so desenha)
  const [carga, setCarga] = useState(null);   // {tipo:"ok"|"erro"|"carregando", txt}
  const entradaRef = useRef(null);
  const carregarMapa = async arquivo => {
    if (!arquivo) return;
    setCarga({tipo:"carregando", txt:"calculando " + arquivo.name + "…"});
    try {
      const texto = await arquivo.text();
      const r = await fetch("api/mapa", {method:"POST", headers:{"Content-Type":"application/json"},
                                          body:JSON.stringify({nome:arquivo.name, texto})});
      const info = await r.json();
      if (!r.ok) throw new Error(info.erro || ("erro " + r.status));
      DADOS[info.nome] = info;
      setNomeMapa(info.nome);
      setCarga({tipo:"ok", txt:"mapa " + info.nome + " carregado (" + info.linhas + "×" + info.colunas + ")"});
    } catch (e) {
      setCarga({tipo:"erro", txt:arquivo.name + ": " + e.message});
    }
    if (entradaRef.current) entradaRef.current.value = "";
  };
  const [fonteConsumivel, setFonteConsumivel] = useState(false);
  const mapaOriginal = DADOS[nomeMapa];

  const mapa = fonteConsumivel && mapaOriginal.versao_consumivel
    ? mapaOriginal.versao_consumivel
    : mapaOriginal;
  const algs = useMemo(() => Object.keys(mapa.percursos).sort((a, b) => ORDEM_ALG.indexOf(a) - ORDEM_ALG.indexOf(b)), [mapa]);
  const [alg, setAlg] = useState(algs[0]);
  const [comparar, setComparar] = useState(false);
  const [extras, setExtras] = useState(null);   // algoritmos comparados com o principal (null = todos)
  const [camada, setCamada] = useState("");
  const [verPresas, setVerPresas] = useState(false);
  const [verTrilha, setVerTrilha] = useState(true);
  const [k, setK] = useState(0);
  const [tocando, setTocando] = useState(false);
  const [vel, setVel] = useState(4);
  const [cel, setCel] = useState(30);
  const [lado, setLado] = useState(1);          // quantos tabuleiros por linha
  const [aba, setAba] = useState("momentos");
  const [verFiguras, setVerFiguras] = useState(false);
  const palcoRef = useRef(null);

  // algoritmo valido para o mapa atual
  const algAtual = algs.includes(alg) ? alg : algs[0];
  const outros = algs.filter(a => a !== algAtual);
  // comparacao: o principal + ate 2 outros = ate 3 tabuleiros ao mesmo tempo
  const extrasAtuais = (extras === null ? outros : outros.filter(a => extras.includes(a))).slice(0, 3);
  const pistas = [algAtual, ...(comparar ? extrasAtuais : [])].filter(Boolean);
  const alternarExtra = a => setExtras(atual => {
    const base = atual === null ? outros : atual;
    return base.includes(a) ? base.filter(x => x !== a) : [...base, a];
  });

  const passosGuia = passosDe(mapa.percursos[algAtual]);
  const ciclo = mapa.percursos[algAtual] && mapa.percursos[algAtual].status === "CICLO_NEGATIVO";
  const total = Math.max(0, ...pistas.map(a => passosDe(mapa.percursos[a]).length - 1));
  const kGuia = passosGuia.length ? Math.min(k, passosGuia.length - 1) : 0;
  const estado = passosGuia[kGuia];
  const custos = useMemo(() => custosDe(mapa, algAtual, passosGuia), [mapa, algAtual]);
  const eventos = useMemo(() => eventosDe(mapa, passosGuia), [mapa, algAtual]);
  const idxBonus = useMemo(() => indicesBonus(mapa.grade, mapa.fonte), [mapa]);
  const chavesDoMapa = useMemo(() => [...new Set(mapa.grade.flat().filter(ch => "abcd".includes(ch)))].sort(), [mapa]);
  const nBonus = Object.keys(idxBonus).length;

  const dentro = useMemo(() => camada && mapa.camadas[camada] ? new Set(mapa.camadas[camada].map(([l, c]) => l + "," + c)) : null, [mapa, camada]);
  const presas = useMemo(() => {
    if (!verPresas) return null;
    return new Set(mapa.armadilhas.filter(([, , ch]) => !camada || ch === camada).map(([l, c]) => l + "," + c));
  }, [mapa, camada, verPresas]);

  // ao trocar mapa: volta ao inicio e ajusta o zoom para caber na tela
  useEffect(() => {
    setFonteConsumivel(false);
  }, [nomeMapa]);

  useEffect(() => {
    setK(0);
    setTocando(false);
    setCamada("");
  }, [nomeMapa, fonteConsumivel]);
  // zoom automatico: escolhe quantos tabuleiros por linha e o tamanho da casa
  // para que TUDO caiba no palco (largura e altura), sem rolar a pagina
  useEffect(() => {
    const el = palcoRef.current;
    if (!el) return;
    const ajustar = () => {
      const W = el.clientWidth - 16, H = el.clientHeight - 16, n = pistas.length;
      let melhor = {cel:0, lado:1};
      for (let la = 1; la <= n; la++){
        const filas = Math.ceil(n / la);
        const t = Math.floor(Math.min((W - 20 * (la - 1)) / la / mapa.colunas,
                                      (H - 40 * filas - 20 * (filas - 1)) / filas / mapa.linhas));
        if (t > melhor.cel) melhor = {cel:t, lado:la};
      }
      setCel(Math.max(8, Math.min(80, melhor.cel)));
      setLado(melhor.lado);
    };
    ajustar();
    const ro = window.ResizeObserver ? new ResizeObserver(ajustar) : null;
    if (ro) ro.observe(el);
    return () => { if (ro) ro.disconnect(); };
  }, [mapa, pistas.length]);
  useEffect(() => { setK(0); setTocando(false); }, [algAtual]);

  // animacao
  useEffect(() => {
    if (!tocando) return;
    const id = setInterval(() => {
      // o ciclo negativo da voltas sem parar; o percurso normal para no fim
      setK(atual => atual >= total ? (ciclo ? 0 : atual) : atual + 1);
    }, 1000 / vel);
    return () => clearInterval(id);
  }, [tocando, vel, total, ciclo]);
  useEffect(() => { if (tocando && !ciclo && k >= total) setTocando(false); }, [k, tocando, total, ciclo]);

  const ir = n => { setTocando(false); setK(Math.max(0, Math.min(total, n))); };
  const alternarTocar = () => {
    if (!total) return;
    if (!tocando && k >= total) setK(0);
    setTocando(t => !t);
  };

  // atalhos de teclado
  const teclas = useRef();
  teclas.current = ev => {
    if (ev.target.matches && ev.target.matches("input,select,textarea")) return;
    if (ev.key === "ArrowRight"){ ev.preventDefault(); ir(k + 1); }
    else if (ev.key === "ArrowLeft"){ ev.preventDefault(); ir(k - 1); }
    else if (ev.key === "Home"){ ev.preventDefault(); ir(0); }
    else if (ev.key === "End"){ ev.preventDefault(); ir(total); }
    else if (ev.key === " " && !(ev.target.matches && ev.target.matches("button"))){ ev.preventDefault(); alternarTocar(); }
  };
  useEffect(() => {
    const f = ev => teclas.current(ev);
    document.addEventListener("keydown", f);
    return () => document.removeEventListener("keydown", f);
  }, []);

  const dur = semMovimento() ? 0 : Math.round(tocando ? Math.min(380, 850 / vel) : 160);
  const delta = kGuia > 0 && custos.length ? custos[kGuia] - custos[kGuia - 1] : null;
  const casaAtual = estado ? mapa.grade[estado.l][estado.c] : null;
  const m = mapa.metricas;
  const ocup = m.teto ? 100 * m.ordem / m.teto : 0;
  const pGuia = mapa.percursos[algAtual];

  // ---------- partes da tela
  const aviso = (() => {
    if (!pGuia || pGuia.status === "OK") return null;
    if (pGuia.status === "CICLO_NEGATIVO") return html`
      <div className="aviso erro"><b>Ciclo negativo detectado</b>
        Não existe custo mínimo: dá para repetir este ciclo para sempre e o custo cai sem limite.
        A animação mostra o ciclo dando voltas. A correção de regra é a opção <span className="mono">--fonte-consumivel</span>.
        <code>${(pGuia.ciclo || []).join(" → ")}</code></div>`;
    if (pGuia.status === "SEM_SOLUCAO") return html`
      <div className="aviso alerta"><b>Sem solução</b>
        Nenhum estado alcançável a partir do início chega ao ALVO.
        Ligue <b style=${{display:"inline"}}>armadilhas</b> para ver os ${mapa.armadilhas.length} estados-armadilha.</div>`;
    if (pGuia.status === "RECUSA") return html`
      <div className="aviso alerta"><b>Dijkstra recusou este mapa</b>
        O grafo tem arco de peso negativo, e o Dijkstra não garante resposta correta nesse caso. Use o Bellman-Ford.
        ${pGuia.mensagem && html`<code>${pGuia.mensagem}</code>`}</div>`;
    return html`<div className="aviso alerta"><b>${pGuia.status}</b></div>`;
  })();

  const legenda = (() => {
    const vistos = new Set(mapa.grade.flat());
    const itens = [["#","parede · intransponível","var(--parede)"],[".","chão · 1","var(--chao)"],[",","lama · 3","var(--lama)"],
                   ["~","água · 5","var(--agua)"],["+","bônus · −4 na 1ª vez","var(--bonus)"],["*", mapa.fonte === "consumivel" ? "fonte · −2 na 1ª vez, depois +1" : "fonte · −2", "var(--fonte)"],
                   ["S","início","var(--inicio)"],["G","saída","var(--saida)"]].filter(([c]) => vistos.has(c));
    const tem = s => [...vistos].some(c => s.includes(c));
    if (tem("abcd")) itens.push(["k", "chave · 1", "var(--chave)"]);
    if (tem("ABCD")) itens.push(["P", "porta · 1", "var(--porta)"]);
    if (tem("><^v")) itens.push(["e", "esteira · 1", "var(--esteira)"]);
    const camadas = Object.keys(mapa.camadas);
    return html`<div className="legenda">
      ${itens.map(([c, n, cor]) => html`<span key=${c}><i className="sw" style=${{background:cor}}></i>${n}</span>`)}
      <span><i className="sw" style=${{background:"repeating-linear-gradient(45deg,rgba(239,68,68,.7) 0 2px,transparent 2px 4px)"}}></i>armadilha</span>
      <div className="titulo">cor do percurso por camada (chaves que já tem)</div>
      ${camadas.map(c => html`<span key=${"c" + c}><i className="sw" style=${{background:corCamada(c)}}></i>${c === "-" ? "sem chaves" : c}</span>`)}
    </div>`;
  })();

  return html`
  <div className="casca">
    <header className="topo">
      <button className="icone voltar" onClick=${aoVoltar} aria-label="Voltar para o início">← Início</button>
      <div className="marca" title="o mapa não é o grafo: cada casa vira vários estados">
        <div className="logo">1</div><h1>Parte 1 · Labirinto com chaves</h1>
      </div>
      <button
          className="ficha"
          aria-pressed=${verFiguras}
          onClick=${() => {
              setTocando(false);
              setVerFiguras(v => !v);
          }}
      >
          ${verFiguras ? "Voltar ao labirinto" : "Visualizações"}
      </button>
      <label className="grupo"><span className="rot-sel">Mapa</span>
        <select className="seletor" value=${nomeMapa} onChange=${e => setNomeMapa(e.target.value)} aria-label="Mapa">
          ${nomes.map(n => html`<option key=${n} value=${n}>${DADOS[n].enviado ? "★ " : ""}${n.replace(/^([mg]\d+)_/, "$1 · ").replace(/_/g, " ")} (${DADOS[n].linhas}×${DADOS[n].colunas})</option>`)}
        </select></label>
      ${servidor && html`
      <label className="icone carregar" title="Enviar um mapa .txt novo; o Python do grupo calcula e a página mostra">
        <input ref=${entradaRef} type="file" accept=".txt,text/plain" hidden onChange=${e => carregarMapa(e.target.files[0])}/>
        ⤒ Carregar mapa</label>`}
      ${mapaOriginal.versao_consumivel && html`
        <label className="alternar">
          <input type="checkbox"
            checked=${fonteConsumivel}
            onChange=${e => {
              setFonteConsumivel(e.target.checked);
              setAlg("BELLMAN_FORD");
            }}/>
          Fonte consumível
        </label>
      `}
      <div className="grupo"><span className="rot-sel">Algoritmo</span>
        <div className="fichas" role="group" aria-label="Algoritmo">
          ${algs.map(a => html`<button key=${a} className="ficha" aria-pressed=${a === algAtual} onClick=${() => setAlg(a)}
              title=${INFO_ALG[a] ? INFO_ALG[a].ideia : a}>
              <span className="bolinha" style=${{background:COR_STATUS[mapa.percursos[a].status]}}></span>
              ${INFO_ALG[a] ? INFO_ALG[a].nome : a}</button>`)}
          ${!algs.length && html`<span className="vazio">nenhum algoritmo disponível</span>`}
        </div></div>
      <div className="grupo">
        <label className="alternar">
          <input type="checkbox" checked=${comparar} onChange=${e => setComparar(e.target.checked)} disabled=${outros.length === 0}/> comparar</label>
        ${comparar && outros.length > 0 && html`
        <div className="fichas" role="group" aria-label="Algoritmos comparados">
          ${outros.map(a => html`<button key=${a} className="ficha" aria-pressed=${extrasAtuais.includes(a)} onClick=${() => alternarExtra(a)}>
              <span className="bolinha" style=${{background:COR_STATUS[mapa.percursos[a].status]}}></span>
              ${INFO_ALG[a] ? INFO_ALG[a].nome : a}</button>`)}
        </div>`}
      </div>
      <label className="grupo"><span className="rot-sel">Camada</span>
        <select className="seletor" value=${camada} onChange=${e => setCamada(e.target.value)} aria-label="Camada">
          <option value="">todas</option>
          ${Object.keys(mapa.camadas).map(c => html`<option key=${c} value=${c}>${c === "-" ? "sem chaves" : "chaves " + c} (${mapa.camadas[c].length})</option>`)}
        </select></label>
      <button className="icone" onClick=${() => setTema(t => t === "light" ? "dark" : "light")}
        aria-label="Alternar tema claro/escuro">${tema === "light" ? "☾ escuro" : "☀ claro"}</button>
    </header>

    ${!mapaOriginal.enviado && OBJETIVO_MAPA[nomeMapa] && html`
    <p className="objetivo-mapa" title=${OBJETIVO_MAPA[nomeMapa]}><b>Objetivo:</b> ${OBJETIVO_MAPA[nomeMapa]}</p>`}

    ${carga && html`
    <div className=${"faixa-carga " + carga.tipo} role="status">
      <span>${carga.tipo === "erro" ? "Mapa recusado — " : ""}${carga.txt}</span>
      ${carga.tipo !== "carregando" && html`<button onClick=${() => setCarga(null)} aria-label="Fechar aviso">×</button>`}
    </div>`}

    ${verFiguras && html`<${GaleriaParte1}/>`}

    <div className="grelha"
        style=${{display:verFiguras ? "none" : undefined}}>
      <div className="cartao">
        <div className="palco" ref=${palcoRef} style=${{"--cel":cel + "px"}}>
          <div className="pistas" style=${{gridTemplateColumns:"repeat(" + Math.min(lado, pistas.length || 1) + ", auto)"}}>
            ${pistas.map(a => html`<${Pista} key=${a} mapa=${mapa} alg=${a} k=${k} dentro=${dentro} presas=${presas}
                mostrarTrilha=${verTrilha} idxBonus=${idxBonus} dur=${dur}/>`)}
          </div>
        </div>
        <div className="transporte">
            <div className="botoes">
              <button className="bt" onClick=${() => ir(0)} disabled=${!total} aria-label="Voltar ao início" title="Início (Home)">${Ic.inicio}</button>
              <button className="bt" onClick=${() => ir(k - 1)} disabled=${!total} aria-label="Um passo atrás" title="Passo atrás (←)">${Ic.voltar}</button>
              <button className="bt tocar" onClick=${alternarTocar} disabled=${!total}
                aria-label=${tocando ? "Pausar" : "Executar"}>${tocando ? Ic.pausar : Ic.tocar}${tocando ? "pausar" : "executar"}</button>
              <button className="bt" onClick=${() => ir(k + 1)} disabled=${!total} aria-label="Um passo à frente" title="Passo à frente (→)">${Ic.avancar}</button>
              <button className="bt" onClick=${() => ir(total)} disabled=${!total} aria-label="Ir para o fim" title="Fim (End)">${Ic.fim}</button>
            </div>
            <div className="linha-tempo">
              <input type="range" min="0" max=${total} value=${Math.min(k, total)} disabled=${!total}
                onChange=${e => ir(+e.target.value)} aria-label="Linha do tempo do percurso"/>
              <span className="contador">passo ${Math.min(k, total)} / ${total}</span>
            </div>
            <label className="campo">velocidade
              <input type="range" min="1" max="15" value=${vel} onChange=${e => setVel(+e.target.value)} aria-label="Passos por segundo"/>
              <b>${vel}/s</b></label>
            <label className="campo">zoom
              <input type="range" min="8" max="90" value=${cel} onChange=${e => setCel(+e.target.value)} aria-label="Tamanho das casas"/></label>
            <label className="alternar"><input type="checkbox" checked=${verTrilha} onChange=${e => setVerTrilha(e.target.checked)}/> trilha</label>
            <label className="alternar"><input type="checkbox" checked=${verPresas} onChange=${e => setVerPresas(e.target.checked)}/> armadilhas
              <small className="mono" style=${{opacity:.7}}>${mapa.armadilhas.length}</small></label>
            <span className="dica" title="atalhos de teclado"><kbd>espaço</kbd> <kbd>←</kbd><kbd>→</kbd></span>
        </div>
      </div>

      <aside>
        ${aviso}
        <div className="bloco" style=${{flex:"none"}}>
          <h2>estado atual <span className="mono" style=${{textTransform:"none",letterSpacing:0}}>${INFO_ALG[algAtual] ? INFO_ALG[algAtual].nome : ""}</span></h2>
          <div className="rotulo" style=${{color:estado ? (ciclo ? "var(--erro)" : corCamada(estado.chaves)) : "var(--txt3)"}}>
            ${estado ? estado.rotulo : "—"}</div>
          <div className="infos">
            <div className="info"><span>posição</span><span>${estado ? "(" + estado.l + ", " + estado.c + ")" : "—"}</span></div>
            <div className="info"><span>casa</span><span>${casaAtual ? nomeCasa(casaAtual) : "—"}</span></div>
            <div className="info"><span>chaves</span>
              <span className="chaves">${chavesDoMapa.length ? chavesDoMapa.map(ch => {
                const tem = estado && (estado.chaves || "").includes(ch);
                return html`<i key=${ch} className=${"chave" + (tem ? " tem" : "")} style=${tem ? {background:"var(--chave)"} : null}>${ch}</i>`;
              }) : html`<span className="vazio">sem chaves</span>`}</span></div>
            <div className="info"><span>bônus consumidos</span>
              <span>${nBonus ? (estado ? (estado.bonus.length ? "{" + estado.bonus.join(",") + "}" : "{}") + " de " + nBonus : "—") : html`<span className="vazio">sem bônus</span>`}</span></div>
          </div>
          <div className="custo-grande">
            <strong>${!ciclo && custos.length ? fmt(custos[kGuia]) : "—"}</strong>
            <span>${algAtual === "DFS" ? "custo não calculado pela DFS" : "custo acumulado" + (algAtual === "BFS" ? " (pelo terreno)" : "")}</span>
            ${delta !== null && !ciclo && html`<span className=${"delta " + (delta < 0 ? "neg" : "pos")}>${delta > 0 ? "+" : ""}${delta}</span>`}
          </div>
        </div>

        <div className="bloco painel-abas">
          <div className="abas" role="tablist">
            ${[["momentos", "Momentos" + (eventos.length ? " " + eventos.length : "")], ["algoritmos", "Algoritmos"],
               ["grafo", "Grafo"], ["legenda", "Legenda"]].map(([id, txt]) => html`
              <button key=${id} role="tab" aria-selected=${aba === id} onClick=${() => setAba(id)}>${txt}</button>`)}
          </div>
          <div className="conteudo-aba" role="tabpanel">
          ${aba === "momentos" && (eventos.length ? html`
          <ul className="eventos">
            ${eventos.map(e => html`<li key=${e.j}><button onClick=${() => ir(e.j)}
                className=${e.j === kGuia ? "atual" : e.j < kGuia ? "passado" : ""}>
                <span className="n">#${e.j}</span><i className="ic" style=${{background:e.cor}}></i>${e.txt}</button></li>`)}
          </ul>` : html`<span className="vazio">nenhum momento marcado neste percurso</span>`)}

          ${aba === "algoritmos" && html`
          <table className="comp">
            <thead><tr><th>algoritmo</th><th>status</th><th className="num">passos</th><th className="num">custo</th></tr></thead>
            <tbody>
              ${algs.map(a => {
                const p = mapa.percursos[a];
                const cs = p.status === "OK" ? custosDe(mapa, a, p.passos) : [];
                return html`<tr key=${a} className=${a === algAtual ? "sel" : ""} onClick=${() => setAlg(a)}>
                  <td>${INFO_ALG[a] ? INFO_ALG[a].nome : a}</td>
                  <td style=${{color:COR_STATUS[p.status]}}>${TXT_STATUS[p.status] || p.status}</td>
                  <td className="num">${p.status === "OK" ? p.n_passos : "—"}</td>
                  <td className="num">${cs.length ? fmt(cs[cs.length - 1]) : "—"}</td></tr>`;
              })}
            </tbody>
          </table>`}

          ${aba === "grafo" && html`
          <div className="tiles">
            <div className="tile"><span>estados (ordem)</span><b>${m.ordem}</b></div>
            <div className="tile"><span>arcos (tamanho)</span><b>${m.tamanho}</b></div>
            <div className="tile"><span>densidade</span><b>${m.densidade.toFixed(5)}</b></div>
            <div className="tile"><span>camadas</span><b>${Object.keys(mapa.camadas).length}</b></div>
            <div className="tile"><span>estados-armadilha</span><b style=${{color:mapa.armadilhas.length ? "var(--erro)" : null}}>${mapa.armadilhas.length}</b></div>
            <div className="tile"><span>teto teórico</span><b>${m.teto}</b></div>
            <div className="tile ocupacao"><span>taxa de ocupação (estados ÷ teto)</span><b>${m.teto ? ocup.toFixed(1) + "%" : "—"}</b>
              <div className="medidor"><i style=${{width:Math.min(100, ocup) + "%"}}></i></div></div>
          </div>`}

          ${aba === "legenda" && legenda}
          </div>
        </div>
      </aside>
    </div>
  </div>`;
}

// navegacao pelo endereco (#parte1, #parte2): o botao voltar do navegador funciona
function Raiz(){
  const ler = () => (location.hash || "").replace("#", "");
  const [tela, setTela] = useState(ler);
  const [tema, setTema] = useState(() =>
    window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  useEffect(() => { document.documentElement.setAttribute("data-theme", tema); }, [tema]);
  // aberta pelo "python -m src.servidor"? entao da para carregar mapas novos
  const [servidor, setServidor] = useState(false);
  useEffect(() => {
    if (!/^https?:$/.test(location.protocol)) return;
    fetch("api/ping").then(r => r.ok ? r.json() : null).then(j => setServidor(!!(j && j.ok))).catch(() => {});
  }, []);
  useEffect(() => {
    const f = () => setTela(ler());
    window.addEventListener("hashchange", f);
    return () => window.removeEventListener("hashchange", f);
  }, []);
  const ir = t => { location.hash = t; };
  const voltar = () => { history.pushState(null, "", location.pathname); setTela(""); };
  if (tela === "parte1") return html`<${Parte1} tema=${tema} setTema=${setTema} aoVoltar=${voltar} servidor=${servidor}/>`;
  if (tela === "parte2") return html`<${Parte2} tema=${tema} setTema=${setTema} aoVoltar=${voltar}/>`;
  return html`<${Inicio} ir=${ir} tema=${tema} setTema=${setTema} servidor=${servidor}/>`;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${Raiz}/>`);
})();
</script>
</body>
</html>
